appId: com.aiguard.desktop
productName: AI Guard
directories:
  output: release
asar: true
files:
  - desktop/**/*
  - dist/core/**/*
  - gui/dist/**/*
  - gui/src-tauri/icons/icon.ico
  - gui/src-tauri/icons/icon.png
  - rules/**/*
  - package.json
extraResources:
  - from: vendor/mihomo
    to: mihomo
  - from: vendor/guard-filter
    to: guard-filter
win:
  target:
    - target: nsis
      arch: [x64]
  icon: gui/src-tauri/icons/icon.png
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Guard
  deleteAppDataOnUninstall: false
  artifactName: AI-Guard-Setup-${version}-${arch}.${ext}
  # 应急入口必须用户找得到。2026-11-06 的事故里, WFP 规则锁死整机网络,
  # 而用户不知道 resources/guard-filter/emergency-unlock.cmd 的存在,
  # 最后只能还原系统。这个快捷方式直接指向该脚本(脚本自身会请求管理员)。
  include: build/emergency-unlock-shortcut.nsh
